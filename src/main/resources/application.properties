spring.application.name=not-so-naive
# Render (and most hosts) provide the port in $PORT; 8080 when run from NetBeans.
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
server.compression.min-response-size=2048

# Uploads: application limit is app.max-file-bytes (2 MB); multipart limits leave headroom.
app.max-file-bytes=2097152
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB
server.tomcat.max-swallow-size=4MB

# Folder with the project sources served as ZIP at /entrega (empty = working directory).
app.project-root=${PROJECT_ROOT:}

spring.thymeleaf.cache=true
spring.web.resources.cache.period=3600
